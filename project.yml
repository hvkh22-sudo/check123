# XcodeGen project spec — generates PassCheck.xcodeproj (no Mac needed to author this).
# CI runs `xcodegen generate` then builds. Fill DEVELOPMENT_TEAM after Apple enrollment.
name: PassCheck
options:
  bundleIdPrefix: com.appstudio
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # Must stay above the very first upload's default of 1.0: iOS never offers an
    # "update" to a lower version, so builds published under 0.1.0 were invisible to
    # a device already running 1.0 (1) — which looked like the uploads were failing.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "645SRC2PTY"   # Apple Team ID (owner's Apple Developer account)
targets:
  PassCheck:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        # User-visible name only. The target, scheme, bundle identifier and App Store
        # Connect record stay `PassCheck`/`com.appstudio.passcheck`: renaming those would
        # break CI and orphan the existing app record. The App Store listing title is
        # "BorderPixel: Passport Photo"; the Home-screen name is the short form.
        CFBundleDisplayName: BorderPixel
        # Without these, XcodeGen bakes a literal "1" into the Info.plist and the build
        # settings are ignored — which is why three uploads were rejected for reusing
        # build number 1. Referencing the settings lets CI override the build number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Portrait-only: the capture/crop flow is designed for one orientation,
        # and iPhone-only avoids untestable iPad multitasking requirements.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Take your passport photo. BorderPixel processes it only on this device and does not upload it."
        # Required by the Save Image path in the share sheet. Without it iOS terminates
        # the app the moment the user saves — on the screen they just paid for.
        NSPhotoLibraryAddUsageDescription: "Save your finished passport photo to the Photos library you select. Photos may sync according to your iCloud settings."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appstudio.passcheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (MVP scope)
  PassCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PassCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appstudio.passcheck.tests
  # Screenshot capture only. Kept out of the PassCheck scheme on purpose: `build-test`
  # must keep running exactly the unit suite it runs today, on every push and PR, without
  # waiting on a simulator UI run that depends on a seeded photo library.
  PassCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PassCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appstudio.passcheck.uitests

# Declared explicitly rather than left to Xcode's autocreation, so that adding a test
# target can never silently change what CI runs under `-scheme PassCheck`.
schemes:
  PassCheck:
    build:
      targets:
        PassCheck: all
        PassCheckTests: [test]
    test:
      targets:
        - PassCheckTests
  PassCheckScreenshots:
    build:
      targets:
        PassCheck: all
        PassCheckUITests: [test]
    test:
      targets:
        - PassCheckUITests
