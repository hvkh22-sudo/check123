name: iOS CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.45.4"
          XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check -
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_dir/xcodegen/bin/xcodegen" --version
      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -version
          ls -d *.xcodeproj
      - name: Build & unit test (no signing)
        run: |
          set +e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          echo "Using simulator id: $UDID"
          xcodebuild test \
            -project PassCheck.xcodeproj \
            -scheme PassCheck \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "----- surfacing errors as annotations -----"
            grep -E "error:|cannot find|Undefined symbol|no such module|is unavailable|Unable to find a destination" build.log | head -50 | sed 's/^/::error::/'
            tail -25 build.log | sed 's/^/::error::/'
            exit "$code"
          fi
  # Manual-only TestFlight upload. The protected environment adds an explicit
  # owner approval after build/test succeeds and before signing secrets are used.
  ship-testflight:
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    environment: testflight
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.45.4"
          XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check -
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_dir/xcodegen/bin/xcodegen" --version
      - name: Generate Xcode project
        run: xcodegen generate   # build number is set by the Fastfile, not edited in here
      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -uo pipefail
          xcodebuild -version
          # The key and raw Fastlane log stay on the ephemeral runner only.
          # Only the short error annotation below is sent to the Actions log.
          trap 'rm -f asc_key.p8 fl.log' EXIT
          for secret_name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required secret ${secret_name} is empty or missing."
              exit 1
            fi
          done
          # Accept either base64 or raw PEM in the secret.
          printf '%s' "$ASC_KEY_P8" | tr -d '\r\n ' | base64 --decode > asc_key.p8 2>/dev/null
          if ! grep -q "BEGIN PRIVATE KEY" asc_key.p8; then
            printf '%s\n' "$ASC_KEY_P8" > asc_key.p8
          fi
          if ! grep -q "BEGIN PRIVATE KEY" asc_key.p8; then
            echo "::error::ASC_KEY_P8 is neither valid base64 of a .p8 nor a raw .p8 PEM. Re-add the secret."
            exit 1
          fi
          if ! openssl pkey -in asc_key.p8 -noout; then
            echo "::error::ASC_KEY_P8 contains a PEM header but the private key does not parse."
            exit 1
          fi
          echo "Private key parses OK."
          export ASC_KEY_PATH="$PWD/asc_key.p8"
          # `if !` rather than a bare call: GitHub runs this step as `bash -e`, and the
          # script's own `set -uo pipefail` does not clear that. A bare failing command
          # therefore killed the shell here before `code=$?` was ever read, so the whole
          # categorisation below — written precisely for a failed upload — was unreachable,
          # and a real failure surfaced as a bare "exit code 1" with nothing to act on.
          if ! bundle exec fastlane beta > fl.log 2>&1; then
            category="unknown"
            grep -qiE 'certificate.*(limit|maximum)|reached the maximum' fl.log && category="certificate-limit"
            grep -qiE 'provisioning profile|no profiles for' fl.log && category="provisioning-profile"
            grep -qiE 'validation failed|ERROR ITMS' fl.log && category="app-store-validation"
            grep -qiE 'authentication|unauthorized|forbidden|401|403' fl.log && category="authentication"
            grep -qiE 'scheme .* not found|does not contain a scheme|xcodebuild: error' fl.log && category="xcode-scheme-or-build"
            grep -qiE 'bundle identifier .* does not exist|BundleId' fl.log && category="bundle-id"
            grep -qiE 'build number|already been used|redundant binary' fl.log && category="build-number"
            grep -qiE 'could not find gem|bundler|LoadError|SyntaxError' fl.log && category="ruby-or-fastlane-startup"
            echo "::error::Fastlane failed (category: ${category}). Raw output was withheld from the public Actions log."

            # The categories above are guesses against a log nobody can read. These two lines
            # are the shape of the failure rather than its content: where it stopped and how
            # big the log got. Neither can carry a key, and together they separate "fastlane
            # never started" from "it ran for two minutes and Apple rejected the binary".
            echo "::error::fastlane produced $(wc -l < fl.log | tr -d ' ') log lines before failing."
            echo "::error::Last fastlane action reached: $(grep -oE '^\[[0-9:]+\]: [-]+ Step: [a-z_]+ [-]+' fl.log | tail -1 | grep -oE 'Step: [a-z_]+' || echo 'none - fastlane did not reach its first step')"
            exit 1
          fi
          echo "Fastlane completed successfully."
